name: Part C Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'eval/golden_set.csv'
      - 'scripts/run_part_c_acceptance.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Part C acceptance
        run: python scripts/run_part_c_acceptance.py
      - name: Commit generated acceptance evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/runs.jsonl outputs/acceptance_transcript.md
          if ! git diff --cached --quiet; then
            git pull --rebase origin main
            git commit -m "Record Part C acceptance evidence"
            git push origin HEAD:main
          fi
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-c-acceptance-evidence
          path: |
            logs/runs.jsonl
            outputs/acceptance_transcript.md
          if-no-files-found: error
