name: Part A validation

on:
  push:
    branches: [main]
    paths:
      - "Part-A/scripts/**"
      - "Part-A/data/**"
      - "Part-A/analysis/**"
      - "requirements.txt"
      - ".github/workflows/part-a-validation.yml"
  workflow_dispatch:

jobs:
  validate-part-a:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate datasets
        run: python Part-A/scripts/generate_data.py
      - name: Clean daily data
        run: python Part-A/scripts/clean_data.py
      - name: Run analysis
        run: python Part-A/scripts/analyze.py
      - name: Run acceptance checks
        run: python Part-A/scripts/run_acceptance.py
      - name: Verify generated outputs match committed files
        run: |
          git diff --exit-code -- Part-A/data/store_daily.csv Part-A/data/inventory.csv Part-A/data/feedback.csv Part-A/data/store_daily_clean.csv Part-A/analysis/cleaning_log.csv
