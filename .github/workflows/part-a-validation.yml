name: Part A validation

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - "analysis/**"
      - "requirements.txt"
      - ".github/workflows/part-a-validation.yml"
  workflow_dispatch:

jobs:
  validate-part-a:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate datasets
        run: python scripts/generate_data.py
      - name: Clean daily data
        run: python scripts/clean_data.py
      - name: Run analysis
        run: python scripts/analyze.py
      - name: Run acceptance checks
        run: python scripts/run_acceptance.py
