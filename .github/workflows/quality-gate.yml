name: Project quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate data cleaning and regenerate analysis reports
        run: |
          python scripts/clean_data.py
          python scripts/analyze.py
          python scripts/run_acceptance.py

      - name: Run agent and weather tests
        run: python -m pytest -q

      - name: Run golden-set evaluation
        run: python -m eval.run_eval

      - name: Upload measured validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmart-validation-artifacts
          path: |
            analysis/data_quality_report.md
            analysis/cleaning_log.csv
            analysis/findings.md
            analysis/executive_summary.md
            eval/eval_results.csv
            eval/eval_runs.jsonl
            eval/eval_summary.md
            docs/release_gate.md
